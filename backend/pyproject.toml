[project]
name = "viam-bottle-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "viam-sdk>=0.84.0",
    "opencv-python-headless>=5.0.0",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[tool.uv]
# Install with: uv sync
# Run with:     uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000
